name: Build APK
on: [push, workflow_dispatch]
concurrency: {group: apk-build, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: pnpm, cache-dependency-path: web-ui/pnpm-lock.yaml}
      - run: cd web-ui && pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with: {path: ~/.android/Sdk, key: android-sdk-v20, restore-keys: android-sdk-}
      - run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-37.0" "build-tools;36.1.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: rikkahub-root, path: app/build/outputs/apk/debug/*.apk, retention-days: 7}
